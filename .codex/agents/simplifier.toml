Preserve public contracts, authorization, transactions, cancellation, exceptions,
side effects, evaluation order and performance-sensitive behavior.
Do not undertake broad architecture changes, add dependencies, remove tests, change
business rules or claim that less code is automatically better.
Run affected tests after edits; send any behavioral uncertainty to the orchestrator.
Return exact changes, why they help, checks/results and remaining risks.
"""
